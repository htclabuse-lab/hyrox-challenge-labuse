<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Accueil — Hyrox Challenge La Buse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 1rem; min-height: 100vh; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .header { background: #FFEE00; color: #0a0a0a; padding: 16px; border-radius: 12px; margin-bottom: 1rem; text-align: center; }
    .header h1 { font-size: 20px; }
    .header p { font-size: 13px; opacity: 0.7; margin-top: 4px; }
    .login { background: #1a1a1a; border-radius: 12px; padding: 1.5rem; text-align: center; }
    .login input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0a0a0a; color: #fff; font-size: 16px; margin: 10px 0; }
    .login button { width: 100%; padding: 12px; background: #FFEE00; color: #0a0a0a; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .toolbar { background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .search-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0a0a0a; color: #fff; font-size: 16px; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-row button { flex: 1; min-width: 90px; background: #0a0a0a; color: #888; border: 1px solid #333; padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .filter-row button.active { background: #FFEE00; color: #0a0a0a; border-color: #FFEE00; font-weight: 800; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: #1a1a1a; border-radius: 10px; padding: 10px; text-align: center; }
    .stat-n { font-size: 22px; font-weight: 800; }
    .stat-n.done { color: #4caf50; }
    .stat-n.pending { color: #FFA726; }
    .stat-l { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .athlete { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .athlete.done { border-color: #4caf50; background: #0a1a0a; opacity: 0.85; }
    .a-head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .dossard { background: #FFEE00; color: #0a0a0a; padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 26px; font-family: monospace; min-width: 70px; text-align: center; flex-shrink: 0; }
    .a-info { flex: 1; min-width: 200px; }
    .a-info b { color: #fff; }
    .a-info .sub { font-size: 12px; color: #888; margin-top: 2px; }
    .a-info .cat { display: inline-block; background: #333; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-top: 4px; }
    .a-meta { font-size: 12px; color: #888; text-align: right; }
    .a-meta strong { color: #FFEE00; }
    .team { background: #FFEE00; color: #0a0a0a; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; margin: 8px 0; }
    .tshirts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .tshirt-card { background: #0a0a0a; border: 1px solid #1B7B49; border-radius: 8px; padding: 8px; text-align: center; }
    .tshirt-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .tshirt-size { font-size: 18px; font-weight: 800; color: #fff; font-family: monospace; }
    .tshirt-coupe { font-size: 11px; color: #aaa; margin-top: 2px; }
    .btn-pack { width: 100%; padding: 14px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: 1px; }
    .btn-pack:hover { background: #2e7d32; }
    .pack-done { background: #0a3a0a; color: #4caf50; padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .btn-undo { background: transparent; color: #888; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .empty { text-align: center; color: #666; padding: 2rem; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🏁 Check-in Accueil</h1>
    <p>Hyrox Challenge La Buse — Dimanche 12 juillet 2026</p>
  </div>

  <div id="login" class="login">
    <div style="font-size:14px;color:#888;margin-bottom:10px;">Mot de passe</div>
    <input type="password" id="pwd" placeholder="••••••••">
    <button onclick="login()">Connexion</button>
    <div id="login-error" style="color:#C0392B;font-size:13px;margin-top:8px;"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="toolbar">
      <input type="text" id="search" class="search-input" placeholder="🔍 Chercher par nom, prénom, équipe ou dossard…" oninput="render()">
      <div class="filter-row">
        <button class="active" data-filter="pending" onclick="setFilter('pending')">⏳ À remettre</button>
        <button data-filter="done" onclick="setFilter('done')">✅ Pack remis</button>
        <button data-filter="all" onclick="setFilter('all')">Tout</button>
      </div>
    </div>
    <div id="stats" class="stats"></div>
    <div id="content"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://mzyfnmjzlosranptwucr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SjaqadxtlQdtASZ6TqE61g_2MyPRKEC';
  const PWD = 'labuse';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let data = [];
  let filterMode = 'pending';

  function login() {
    const p = document.getElementById('pwd').value.trim();
    if (p !== PWD) { document.getElementById('login-error').textContent = '❌ Mot de passe incorrect'; return; }
    sessionStorage.setItem('hc_auth', '1');
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    load();
  }
  if (sessionStorage.getItem('hc_auth') === '1') {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    setTimeout(load, 0);
  }

  function setFilter(m) {
    filterMode = m;
    document.querySelectorAll('.filter-row button').forEach(b => b.classList.toggle('active', b.dataset.filter === m));
    render();
  }

  async function load() {
    const { data: rows } = await db.from('Inscriptions')
      .select('id,prenom,nom,email,telephone,categorie,nom_equipe,tshirt_coupe,tshirt_taille,co1_prenom,co1_nom,co1_tshirt,co2_prenom,co2_nom,co2_tshirt,co3_prenom,co3_nom,co3_tshirt,dossard,vague,heure_depart,pack_remis_at,statut_paiement')
      .neq('categorie', 'Parent-Enfant')
      .neq('categorie', 'Hyrox Kids Pré-inscription')
      .neq('categorie', 'Bénévole')
      .eq('statut_paiement', 'paye')
      .gte('heure_depart', '2026-07-12')
      .lt('heure_depart', '2026-07-13')
      .order('dossard');
    data = rows || [];
    render();
  }
  setInterval(load, 30000);

  function fmtHeure(iso) {
    if (!iso) return '?';
    return new Date(iso).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit', timeZone: 'Indian/Reunion'});
  }
  function norm(s) { return (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function isPacked(d) { return !!d.pack_remis_at; }

  function render() {
    const q = norm(document.getElementById('search').value.trim());
    const all = data.filter(d => {
      if (q) {
        const hay = norm(`${d.prenom} ${d.nom} ${d.nom_equipe} ${d.dossard} ${d.co1_prenom} ${d.co1_nom} ${d.co2_prenom} ${d.co2_nom} ${d.co3_prenom} ${d.co3_nom}`);
        if (!hay.includes(q)) return false;
      }
      const packed = isPacked(d);
      if (filterMode === 'pending' && packed) return false;
      if (filterMode === 'done' && !packed) return false;
      return true;
    });

    const nbDone = data.filter(isPacked).length;
    const nbPending = data.length - nbDone;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-n pending">${nbPending}</div><div class="stat-l">⏳ À remettre</div></div>
      <div class="stat"><div class="stat-n done">${nbDone}</div><div class="stat-l">✅ Pack remis</div></div>
    `;

    if (all.length === 0) {
      document.getElementById('content').innerHTML = `<div class="empty">${q ? 'Aucun résultat.' : 'Personne dans ce filtre.'}</div>`;
      return;
    }

    let html = '';
    all.forEach(d => {
      const packed = isPacked(d);
      const isDuo = /duo/i.test(d.categorie);
      const isRelais = /relais/i.test(d.categorie);
      const captT = (d.tshirt_taille && d.tshirt_coupe) ? `${d.tshirt_taille}` : '—';
      const captCoupe = d.tshirt_coupe || '';

      html += `<div class="athlete ${packed ? 'done' : ''}">`;
      html += `<div class="a-head">`;
      html += `<div class="dossard">#${d.dossard}</div>`;
      html += `<div class="a-info"><b>${(d.prenom || '').trim()} ${(d.nom || '').trim()}</b><div class="sub">${d.email || ''} · ${d.telephone || ''}</div><div class="cat">${d.categorie}</div></div>`;
      html += `<div class="a-meta">V${d.vague}<br><strong>${fmtHeure(d.heure_depart)}</strong></div>`;
      html += `</div>`;

      if (d.nom_equipe) html += `<div class="team">🏷 ${d.nom_equipe}</div>`;

      // T-shirts (parent + co-équipiers)
      html += `<div class="tshirts">`;
      html += `<div class="tshirt-card"><div class="tshirt-label">👤 ${(d.prenom || '').trim()}</div><div class="tshirt-size">${captT}</div><div class="tshirt-coupe">${captCoupe}</div></div>`;
      if (isDuo || isRelais) {
        [1, 2, 3].forEach(i => {
          const p = d[`co${i}_prenom`]; const t = d[`co${i}_tshirt`];
          if (p && p.trim()) html += `<div class="tshirt-card"><div class="tshirt-label">👤 ${p.trim()}</div><div class="tshirt-size">${t || '—'}</div><div class="tshirt-coupe">&nbsp;</div></div>`;
        });
      }
      html += `</div>`;

      if (packed) {
        html += `<div class="pack-done"><span>✅ Pack remis à ${fmtHeure(d.pack_remis_at)}</span><button class="btn-undo" onclick="undoPack(${d.id})">↺ Annuler</button></div>`;
      } else {
        html += `<button class="btn-pack" onclick="givePack(${d.id})">✅ PACK REMIS</button>`;
      }
      html += `</div>`;
    });
    document.getElementById('content').innerHTML = html;
  }

  async function givePack(id) {
    const now = new Date().toISOString();
    await db.from('Inscriptions').update({ pack_remis_at: now }).eq('id', id);
    await load();
  }
  async function undoPack(id) {
    if (!confirm('Annuler la remise du pack ?')) return;
    await db.from('Inscriptions').update({ pack_remis_at: null }).eq('id', id);
    await load();
  }
</script>
</body>
</html>
