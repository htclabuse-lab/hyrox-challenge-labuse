<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Hyrox Challenge La Buse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }

    .header { background: #0a0a0a; border-bottom: 3px solid #FFEE00; padding: 1.5rem 1rem; text-align: center; }
    .header a { color: #FFEE00; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 8px; }
    .title { font-size: 22px; font-weight: 800; color: #fff; }
    .title span { color: #FFEE00; }
    .subtitle { font-size: 13px; color: #888; margin-top: 4px; }

    .event-tabs { max-width: 600px; margin: 1rem auto 0; padding: 0 1rem; display: flex; gap: 8px; }
    .event-tab { flex: 1; padding: 12px 14px; background: #111; border: 2px solid #222; border-radius: 10px; color: #888; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; }
    .event-tab.active { background: #FFEE00; color: #0a0a0a; border-color: #FFEE00; }
    .event-tab .ev-meta { font-size: 11px; opacity: 0.7; font-weight: 400; display: block; margin-top: 2px; }

    .search-wrap { max-width: 600px; margin: 1rem auto 0; padding: 0 1rem; }
    .search-input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid #333; background: #111; color: #fff; font-size: 15px; font-family: inherit; }
    .search-input:focus { outline: none; border-color: #FFEE00; }

    .filters { max-width: 600px; margin: 1rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 10px; }
    .filter-label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: #888; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .filter-btn.active { background: #FFEE00; color: #0a0a0a; border-color: #FFEE00; }

    .content { max-width: 600px; margin: 0 auto; padding: 0 1rem 3rem; }

    .cat-section { margin-bottom: 1.5rem; }
    .cat-title { font-size: 14px; font-weight: 800; color: #FFEE00; background: #1a1400; padding: 12px 14px; border-radius: 10px 10px 0 0; border: 1px solid #FFEE00; border-bottom: none; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
    .cat-title .cat-count { color: #aaa; font-size: 11px; font-weight: 400; }
    .cat-body { background: #111; border: 1px solid #222; border-radius: 0 0 10px 10px; overflow: hidden; }

    .age-sub-title { font-size: 11px; font-weight: 700; color: #aaa; background: #1a1a1a; padding: 8px 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .age-sub-title .age-count { color: #666; font-weight: 400; }

    .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1a1a1a; cursor: default; }
    .row:last-child { border-bottom: none; }
    .row.clickable { cursor: pointer; }
    .row.clickable:hover { background: #1a1a1a; }
    .row.clickable:active { background: #222; }
    .pos { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
    .pos-1 { background: #FFEE00; color: #0a0a0a; }
    .pos-2 { background: #aaa; color: #0a0a0a; }
    .pos-3 { background: #c87941; color: #fff; }
    .pos-n { background: #1a1a1a; color: #666; font-size: 11px; }
    .name-block { flex: 1; min-width: 0; font-size: 13px; color: #fff; font-weight: 600; line-height: 1.3; }
    .team { font-size: 11px; color: #888; font-weight: 400; margin-top: 2px; }
    .time { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 14px; color: #FFEE00; font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .chev { color: #555; font-size: 10px; margin-left: 4px; flex-shrink: 0; }

    .details { padding: 14px 16px; background: #050505; border-top: 1px dashed #333; border-bottom: 1px solid #1a1a1a; }
    .splits-table { width: 100%; font-size: 12px; border-collapse: collapse; }
    .splits-table tr { border-bottom: 1px solid #1a1a1a; }
    .splits-table tr:last-child { border-bottom: none; }
    .splits-table td { padding: 7px 4px; vertical-align: middle; }
    .splits-table .st-num { width: 22px; height: 22px; border-radius: 50%; background: #1a1a1a; color: #FFEE00; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; }
    .splits-table .st-label { color: #ddd; }
    .splits-table .st-split { color: #FFEE00; font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; white-space: nowrap; }
    .splits-table .st-penal { color: #ffaa00; font-size: 10px; font-weight: 700; white-space: nowrap; text-align: right; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; font-size: 12px; }
    .summary .srow { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; padding: 10px 12px; }
    .summary .srow .lbl { color: #666; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .summary .srow .val { color: #fff; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .summary .srow.total { grid-column: 1 / -1; background: #1a1a00; border-color: #FFEE00; }
    .summary .srow.total .val { color: #FFEE00; font-size: 18px; }

    .empty-state, .no-results { padding: 3rem 1rem; text-align: center; color: #666; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html">← Retour au site</a>
  <div class="title">Leader<span>board</span></div>
  <div id="event-subtitle" class="subtitle">Choisis un événement</div>
</div>

<div class="event-tabs" id="event-tabs"></div>

<div class="search-wrap">
  <input id="search" class="search-input" type="search" placeholder="🔎 Cherche un athlète ou une équipe..." autocomplete="off">
</div>

<div class="filters">
  <div>
    <div class="filter-label">Catégorie</div>
    <div class="filter-group" id="filter-cat"></div>
  </div>
  <div>
    <div class="filter-label">Catégorie d'âge</div>
    <div class="filter-group" id="filter-age"></div>
  </div>
</div>

<div class="content" id="leaderboard">
  <div class="empty-state">Chargement…</div>
</div>

<script>
const CAT_ORDER = [
  'solo rx hommes', 'solo scaled hommes', 'solo rx femmes', 'solo scaled femmes',
  'duo rx homme', 'duo rx femme', 'duo rx mixte',
  'duo scaled hommes', 'duo scaled femmes', 'duo scaled mixte',
  'relais'
];
const CAT_LABELS = {
  'solo rx hommes': 'Solo RX Hommes',
  'solo scaled hommes': 'Solo Scaled Hommes',
  'solo rx femmes': 'Solo RX Femmes',
  'solo scaled femmes': 'Solo Scaled Femmes',
  'duo rx homme': 'Duo RX Hommes',
  'duo rx femme': 'Duo RX Femmes',
  'duo rx mixte': 'Duo RX Mixte',
  'duo scaled hommes': 'Duo Scaled Hommes',
  'duo scaled femmes': 'Duo Scaled Femmes',
  'duo scaled mixte': 'Duo Scaled Mixte',
  'relais': 'Relais',
};
const AGE_ORDER = ['16-24', '25-34', '35-44', '45-54', '55+'];

let allEvents = [];
let selectedEventIdx = 0;
let currentCat = 'all';
let currentAge = 'all';
let searchQ = '';
let expandedKey = null;

function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

function timeToSeconds(t) {
  if (!t) return Number.MAX_SAFE_INTEGER;
  const p = String(t).split(':');
  if (p.length !== 3) return Number.MAX_SAFE_INTEGER;
  return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
}

function formatBrut(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
  return `${m}m ${String(sec).padStart(2,'0')}s`;
}

function formatDateFr(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
}

async function loadAll() {
  try {
    const r = await fetch('/api/event2-resultats');
    if (r.ok) {
      const ev = await r.json();
      allEvents.push(ev);
    }
  } catch (err) { console.error('event-2', err); }
  try {
    const r = await fetch('/data/event-1.json');
    if (r.ok) {
      const ev = await r.json();
      allEvents.push(ev);
    }
  } catch (err) { console.error('event-1', err); }
  if (allEvents.length === 0) {
    $('leaderboard').innerHTML = '<div class="no-results">Impossible de charger les résultats.</div>';
    return;
  }
  // Default: event #2 si il a des résultats finis, sinon event #1
  selectedEventIdx = (allEvents[0].resultats && allEvents[0].resultats.length > 0) ? 0 : Math.min(1, allEvents.length - 1);
  renderTabs();
  renderFilters();
  render();
}

function renderTabs() {
  const tabs = $('event-tabs');
  tabs.innerHTML = allEvents.map((ev, idx) => {
    const subtitle = ev.event.in_progress ? 'en cours' : formatDateFr(ev.event.date);
    return `<button class="event-tab ${idx === selectedEventIdx ? 'active' : ''}" data-idx="${idx}">
      ${escapeHtml(ev.event.nom)}
      <span class="ev-meta">${escapeHtml(subtitle)}</span>
    </button>`;
  }).join('');
  tabs.querySelectorAll('.event-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedEventIdx = parseInt(btn.dataset.idx, 10);
      currentCat = 'all';
      currentAge = 'all';
      searchQ = '';
      $('search').value = '';
      expandedKey = null;
      renderTabs();
      renderFilters();
      render();
    });
  });
  const ev = allEvents[selectedEventIdx];
  if (ev) $('event-subtitle').textContent = ev.event.in_progress ? 'Résultats en direct' : ev.event.nom + ' — ' + formatDateFr(ev.event.date);
}

function renderFilters() {
  const ev = allEvents[selectedEventIdx];
  if (!ev) return;
  // Catégories présentes dans cet event
  const catsInEvent = new Set(ev.resultats.map(r => r.cat));
  const catsArr = CAT_ORDER.filter(c => catsInEvent.has(c));
  $('filter-cat').innerHTML = '<button class="filter-btn active" data-cat="all">Toutes</button>' +
    catsArr.map(c => `<button class="filter-btn" data-cat="${escapeHtml(c)}">${escapeHtml(CAT_LABELS[c] || c)}</button>`).join('');
  $('filter-cat').querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      $('filter-cat').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  const agesInEvent = new Set(ev.resultats.map(r => r.age).filter(Boolean));
  const agesArr = AGE_ORDER.filter(a => agesInEvent.has(a));
  $('filter-age').innerHTML = '<button class="filter-btn active" data-age="all">Toutes</button>' +
    agesArr.map(a => `<button class="filter-btn" data-age="${escapeHtml(a)}">${escapeHtml(a)} ans</button>`).join('');
  $('filter-age').querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentAge = btn.dataset.age;
      $('filter-age').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

function matchSearch(r, q) {
  if (!q) return true;
  const ql = q.toLowerCase();
  return (r.nom || '').toLowerCase().includes(ql) || (r.membres || '').toLowerCase().includes(ql);
}

function render() {
  const ev = allEvents[selectedEventIdx];
  if (!ev) return;

  const filtered = ev.resultats.filter(r => {
    if (currentCat !== 'all' && r.cat !== currentCat) return false;
    if (currentAge !== 'all' && r.age !== currentAge) return false;
    if (searchQ && !matchSearch(r, searchQ)) return false;
    return true;
  });

  // Group by cat, then by age. Each (cat, age) is sorted by temps.
  const byCat = {};
  for (const r of filtered) {
    if (!byCat[r.cat]) byCat[r.cat] = {};
    const ageKey = r.age || '—';
    if (!byCat[r.cat][ageKey]) byCat[r.cat][ageKey] = [];
    byCat[r.cat][ageKey].push(r);
  }
  for (const cat in byCat) {
    for (const age in byCat[cat]) {
      byCat[cat][age].sort((a, b) => timeToSeconds(a.temps) - timeToSeconds(b.temps));
    }
  }

  let html = '';
  let total = 0;
  for (const cat of CAT_ORDER) {
    const ageGroups = byCat[cat];
    if (!ageGroups) continue;
    const catCount = Object.values(ageGroups).reduce((s, a) => s + a.length, 0);
    total += catCount;
    html += `<div class="cat-section">
      <div class="cat-title"><span>${escapeHtml(CAT_LABELS[cat] || cat)}</span><span class="cat-count">${catCount} participant${catCount > 1 ? 's' : ''}</span></div>
      <div class="cat-body">`;

    const ages = AGE_ORDER.filter(a => ageGroups[a]);
    // Add "no age" group at the end if present
    if (ageGroups['—']) ages.push('—');
    if (ages.length === 0) {
      // shouldn't happen but defensive
      ages.push(...Object.keys(ageGroups));
    }
    for (const age of ages) {
      const rows = ageGroups[age];
      if (!rows || rows.length === 0) continue;
      const ageLabel = age === '—' ? 'Sans tranche d\'âge' : escapeHtml(age) + ' ans';
      html += `<div class="age-sub-title"><span>${ageLabel}</span><span class="age-count">${rows.length}</span></div>`;
      rows.forEach((r, i) => {
        const pos = i + 1;
        const posClass = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-n';
        const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : String(pos);
        const hasDetail = Array.isArray(r.splits) && r.splits.length > 0;
        const rowKey = `${selectedEventIdx}-${cat}-${age}-${i}`;
        const isExpanded = expandedKey === rowKey;
        const chev = hasDetail ? `<span class="chev">${isExpanded ? '▴' : '▾'}</span>` : '';
        html += `<div class="row${hasDetail ? ' clickable' : ''}" data-key="${rowKey}"${hasDetail ? ' data-clickable="1"' : ''}>
          <div class="pos ${posClass}">${medal}</div>
          <div class="name-block">${escapeHtml(r.nom)}${r.membres ? '<div class="team">' + escapeHtml(r.membres) + '</div>' : ''}</div>
          <div class="time">${escapeHtml(r.temps || '—')}</div>
          ${chev}
        </div>`;
        if (hasDetail && isExpanded) {
          html += renderDetails(r);
        }
      });
    }
    html += '</div></div>';
  }

  if (total === 0) {
    html = '<div class="no-results">Aucun résultat ne correspond.<br>Modifie ta recherche ou tes filtres.</div>';
  }
  $('leaderboard').innerHTML = html;

  $('leaderboard').querySelectorAll('.row[data-clickable="1"]').forEach(row => {
    row.addEventListener('click', () => {
      const key = row.dataset.key;
      expandedKey = (expandedKey === key) ? null : key;
      render();
    });
  });
}

function renderDetails(r) {
  const splitsRows = r.splits.map(s => {
    const penaltyParts = [];
    if (s.penalite_5min > 0) penaltyParts.push(`${s.penalite_5min}×5min`);
    if (s.penalite_30s > 0) penaltyParts.push(`${s.penalite_30s}×30s`);
    const penalty = penaltyParts.length ? `<td class="st-penal">⚠️ +${penaltyParts.join(' ')}</td>` : '<td></td>';
    return `<tr>
      <td><span class="st-num">${s.station}</span></td>
      <td class="st-label">${escapeHtml(s.label)}</td>
      ${penalty}
      <td class="st-split">${escapeHtml(s.split)}</td>
    </tr>`;
  }).join('');
  const penaltyParts = [];
  if (r.penalite_5min > 0) penaltyParts.push(`${r.penalite_5min}×5min`);
  if (r.penalite_30s > 0) penaltyParts.push(`${r.penalite_30s}×30s`);
  const penalitesLabel = penaltyParts.length ? penaltyParts.join(' + ') : 'aucune';
  const penSec = (r.penalite_30s || 0) * 30 + (r.penalite_5min || 0) * 300;
  return `<div class="details">
    <table class="splits-table"><tbody>${splitsRows}</tbody></table>
    <div class="summary">
      <div class="srow"><div class="lbl">Temps brut</div><div class="val">${escapeHtml(formatBrut(r.brut_sec))}</div></div>
      <div class="srow"><div class="lbl">Pénalités</div><div class="val">${penalitesLabel}${penSec > 0 ? ' <span style="color:#ffaa00;">(+' + formatBrut(penSec) + ')</span>' : ''}</div></div>
      <div class="srow total"><div class="lbl">Temps final</div><div class="val">${escapeHtml(r.temps)}</div></div>
    </div>
  </div>`;
}

const searchInput = $('search');
let debounceTimer = null;
searchInput.addEventListener('input', () => {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQ = searchInput.value;
    expandedKey = null;
    render();
  }, 120);
});

loadAll();
</script>
</body>
</html>
