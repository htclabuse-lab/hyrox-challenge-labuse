var currentCat = 'all';
var currentAge = 'all';

function timeToSeconds(t) {
  var p = t.split(':');
  return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
}

function getCatLabel(cat) {
  var labels = {
    'rx hommes': 'RX Hommes', 'scaled hommes': 'Scaled Hommes',
    'rx femme': 'RX Femmes', 'scaled femmes': 'Scaled Femmes',
    'duo rx homme': 'Duo RX Hommes', 'duo rx femme': 'Duo RX Femmes',
    'duo rx mixte': 'Duo RX Mixte', 'duo scaled hommes': 'Duo Scaled Hommes',
    'duo scaled femmes': 'Duo Scaled Femmes', 'duo scaled mixte': 'Duo Scaled Mixte',
    'relais': 'Relais'
  };
  return labels[cat] || cat;
}

function getPosClass(pos) {
  if (pos === 1) return 'pos-1';
  if (pos === 2) return 'pos-2';
  if (pos === 3) return 'pos-3';
  return 'pos-n';
}

function render() {
  var filtered = DATA.filter(function(d) {
    var catMatch = currentCat === 'all' || d.cat.toLowerCase().includes(currentCat.toLowerCase()) || currentCat.toLowerCase().includes(d.cat.toLowerCase()) || d.cat === currentCat;
    var ageMatch = currentAge === 'all' || d.age === currentAge;
    return catMatch && ageMatch;
  });

  // Grouper par catégorie
  var groups = {};
  filtered.forEach(function(d) {
    if (!groups[d.cat]) groups[d.cat] = [];
    groups[d.cat].push(d);
  });

  // Trier chaque groupe par temps
  Object.keys(groups).forEach(function(cat) {
    groups[cat].sort(function(a, b) { return timeToSeconds(a.temps) - timeToSeconds(b.temps); });
  });

  var html = '';
  var catOrder = ['rx hommes','scaled hommes','rx femme','scaled femmes','duo rx homme','duo rx femme','duo rx mixte','duo scaled hommes','duo scaled femmes','duo scaled mixte','relais'];

  catOrder.forEach(function(cat) {
    if (!groups[cat]) return;
    html += '<div class="cat-section">';
    html += '<div class="cat-title">' + getCatLabel(cat) + ' <span style="color:#666;font-size:11px;font-weight:400;">(' + groups[cat].length + ' participants)</span></div>';
    html += '<div class="cat-body">';
    groups[cat].forEach(function(d, i) {
      var posClass = getPosClass(i + 1);
      var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      html += '<div class="row">';
      html += '<div class="pos ' + posClass + '">' + medal + '</div>';
      html += '<div class="name">' + d.nom;
      if (d.membres) html += '<div class="team">' + d.membres + '</div>';
      if (d.age) html += '<div class="age-cat">' + d.age + ' ans</div>';
      html += '</div>';
      html += '<div class="time">' + d.temps + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  if (!html) html = '<div class="no-results">Aucun résultat pour cette sélection.</div>';
  document.getElementById('leaderboard').innerHTML = html;
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('#filter-cat .filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function filterAge(age, btn) {
  currentAge = age;
  document.querySelectorAll('#filter-age .filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

render();
</script>
</body>
</html>
