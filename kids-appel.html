<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAINING KIDS — Feuille d'appel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 1rem; min-height: 100vh; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .hero { background: #0a0a0a; padding: 1.5rem 1rem; text-align: center; margin-bottom: 1rem; border-radius: 14px; border: 2px solid #FFEE00; }
    .hero h1 { font-size: 38px; font-weight: 900; letter-spacing: 2px; line-height: 1; margin-bottom: 8px; }
    .hero h1 span { color: #FFEE00; }
    .hero .sub { font-size: 14px; color: #aaa; margin-bottom: 12px; }
    .hero .slogan { color: #FFEE00; font-weight: 800; font-size: 14px; letter-spacing: 1.5px; margin-top: 8px; line-height: 1.4; }
    .hero .date { background: #C0392B; color: #fff; display: inline-block; padding: 6px 14px; border-radius: 6px; font-weight: 800; margin-top: 12px; font-size: 14px; }
    .info-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .info { background: #1a1a1a; border-radius: 12px; padding: 1rem; border-left: 4px solid #ff3399; }
    .info.creneaux { border-left-color: #FFA726; }
    .info.places { border-left-color: #C0392B; }
    .info.prix { border-left-color: #FFEE00; }
    .info h3 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .info p { font-size: 14px; line-height: 1.6; }
    .creneau-line { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; line-height: 1.5; }
    .creneau-line .dot { margin-top: 5px; }
    .creneau-line strong { color: #fff; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.pink { background: #ff3399; } .dot.cyan { background: #00d8ff; } .dot.orange { background: #FFA726; } .dot.green { background: #4ade80; }
    .prix-big { font-size: 32px; font-weight: 900; color: #FFEE00; }
    .prix-small { font-size: 14px; color: #aaa; }
    .form-card { background: #1a1a1a; border-radius: 14px; padding: 1.5rem; border: 1px solid #333; }
    .form-card h2 { font-size: 18px; color: #FFEE00; margin-bottom: 6px; }
    .form-card .form-sub { font-size: 12px; color: #888; margin-bottom: 1rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0a0a0a; color: #fff; font-size: 15px; }
    .field input:focus { border-color: #FFEE00; outline: none; }
    .section-divider { font-size: 12px; color: #FFEE00; text-transform: uppercase; letter-spacing: 1px; margin: 1rem 0 0.6rem; padding-top: 1rem; border-top: 1px solid #2a2a2a; font-weight: 700; }
    .checkboxes label { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #333; border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
    .checkboxes label:has(input:checked) { border-color: #FFEE00; background: #1a1a0a; }
    .checkboxes input { width: 20px; height: 20px; accent-color: #FFEE00; }
    .btn-submit { width: 100%; padding: 16px; background: #FFEE00; color: #0a0a0a; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: 1px; margin-top: 1rem; }
    .btn-submit:hover { background: #e6d800; }
    .btn-submit:disabled { background: #444; color: #888; cursor: wait; }
    .success { background: #0a3a0a; border: 2px solid #4caf50; border-radius: 14px; padding: 2rem; text-align: center; }
    .success-icon { font-size: 64px; margin-bottom: 12px; }
    .success h2 { color: #4caf50; font-size: 22px; margin-bottom: 10px; }
    .success p { color: #ccc; font-size: 14px; line-height: 1.6; }
    .hero .tagline { font-size: 16px; font-style: italic; color: #fff; margin-bottom: 6px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { background: #2a2a2a; border: 1px solid #444; color: #ddd; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.ok { border-color: #4ade80; color: #4ade80; }
    .info .desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2a; }
    .contact { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 1rem; margin-top: 1rem; text-align: center; }
    .contact-line { font-size: 14px; color: #ddd; padding: 4px 0; }
    .contact a { color: #FFEE00; text-decoration: none; font-weight: 700; }
    .footer-slogan { text-align: center; font-size: 13px; font-weight: 800; color: #888; letter-spacing: 1px; margin: 1.2rem 0 0.5rem; }
    .error { color: #C0392B; font-size: 13px; margin-top: 8px; }

    .places-live { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .place-box { background: #0a0a0a; border: 1px solid #333; border-radius: 10px; padding: 10px; text-align: center; }
    .place-box .n { font-size: 26px; font-weight: 900; color: #4ade80; }
    .place-box .n.full { color: #C0392B; }
    .place-box .l { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .rules { font-size: 13px; color: #bbb; line-height: 1.6; }
    .rules li { margin: 4px 0 4px 1rem; }
    .checkboxes label.long { align-items: flex-start; line-height: 1.5; }
    .checkboxes label.long input { margin-top: 2px; flex-shrink: 0; }
    .warn { background: #2a1a00; border: 1px solid #FFA726; border-radius: 10px; padding: 12px; font-size: 13px; color: #ffd9a0; margin-bottom: 1rem; line-height: 1.5; }

    .appel-row { display:flex; align-items:center; gap:12px; background:#0a0a0a; border:1px solid #333; border-radius:12px; padding:12px; margin-bottom:8px; }
    .appel-row.ok { border-color:#4ade80; background:#0a1a0a; }
    .appel-row.no { border-color:#C0392B; background:#1a0a0a; opacity:.75; }
    .appel-row .who { flex:1; min-width:0; }
    .appel-row .nom { font-size:16px; font-weight:800; color:#fff; }
    .appel-row .meta { font-size:12px; color:#888; margin-top:2px; }
    .btn-p { border:none; border-radius:10px; width:52px; height:46px; font-size:20px; font-weight:900; cursor:pointer; flex-shrink:0; }
    .btn-p.oui { background:#2a2a2a; color:#666; } .btn-p.oui.on { background:#4ade80; color:#0a0a0a; }
    .btn-p.non { background:#2a2a2a; color:#666; } .btn-p.non.on { background:#C0392B; color:#fff; }
    .gtitle { font-size:17px; font-weight:900; color:#FFEE00; margin:1.5rem 0 0.6rem; }
    .gtitle span { color:#888; font-size:13px; font-weight:600; }
    .tag { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
    select.date { width:100%; background:#0a0a0a; color:#fff; border:1px solid #444; border-radius:10px; padding:12px; font-size:15px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero" style="padding:1rem;">
    <h1 style="font-size:26px;">TRAINING <span>KIDS</span></h1>
    <div class="sub" style="margin:0;">Feuille d'appel du samedi</div>
  </div>

  <div id="login" class="form-card">
    <h2>Connexion</h2>
    <p class="form-sub">Mot de passe coach.</p>
    <div class="field"><input type="password" id="pwd" placeholder="Mot de passe" onkeypress="if(event.key==='Enter') connexion()"></div>
    <button type="button" class="btn-submit" onclick="connexion()">Entrer</button>
    <div class="error" id="err"></div>
  </div>

  <div id="app" style="display:none;">
    <select class="date" id="date" onchange="charger()"></select>
    <div id="liste"></div>
    <div style="text-align:center;margin:1.5rem 0;">
      <button type="button" onclick="charger()" style="background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px;">↻ Rafraîchir</button>
    </div>
  </div>

  <div class="footer-slogan">DES KIDS AUJOURD'HUI, DES CHAMPIONS DEMAIN !</div>
</div>

<script>
  var PWD = sessionStorage.getItem('kids_appel_pwd') || '';
  var LISTE = null;
  var GROUPES = { petits: { label: 'Groupe 1', heure: '8h45 - 9h30' }, grands: { label: 'Groupe 2', heure: '9h30 - 10h30' } };

  function samedis(n) {
    var out = [], d = new Date(); d.setHours(12,0,0,0);
    while (d.getDay() !== 6) d.setDate(d.getDate() + 1);
    for (var i = 0; i < n; i++) { out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate() + 7); }
    return out;
  }
  function jolie(d) {
    var p = d.split('-');
    return new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12)).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' });
  }
  function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function remplirDates() {
    var sel = document.getElementById('date');
    if (sel.options.length) return;
    samedis(6).forEach(function(d){
      var o = document.createElement('option'); o.value = d; o.textContent = jolie(d); sel.appendChild(o);
    });
  }

  async function api(body) {
    var r = await fetch('/api/kids-reservation', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    var j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status);
    return j;
  }

  async function connexion() {
    var p = document.getElementById('pwd').value.trim();
    if (!p) return;
    document.getElementById('err').textContent = '';
    try {
      remplirDates();
      await api({ action:'appel', password:p, date: document.getElementById('date').value });
      PWD = p; sessionStorage.setItem('kids_appel_pwd', p);
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      charger();
    } catch (e) {
      document.getElementById('err').textContent = e.message.indexOf('Non autoris') !== -1 ? '❌ Mot de passe incorrect' : e.message;
    }
  }

  async function charger() {
    remplirDates();
    var d = document.getElementById('date').value;
    document.getElementById('liste').innerHTML = '<div style="color:#888;padding:1rem;text-align:center;">Chargement…</div>';
    try {
      var j = await api({ action:'appel', password:PWD, date:d });
      LISTE = j.liste; rendre();
    } catch (e) {
      document.getElementById('liste').innerHTML = '<div class="error" style="padding:1rem;">' + esc(e.message) + '</div>';
    }
  }

  async function pointer(id, present) {
    try {
      await api({ action:'presence', password:PWD, id:id, date:document.getElementById('date').value, present:present });
      LISTE.forEach(function(x){ if (x.id === id) x.present = present; });
      rendre();
    } catch (e) { alert(e.message); }
  }

  function rendre() {
    var h = '';
    ['petits','grands'].forEach(function(gk) {
      var g = GROUPES[gk];
      var l = LISTE.filter(function(x){ return x.groupe === gk; });
      var p = l.filter(function(x){ return x.present === true; }).length;
      h += '<div class="gtitle">' + g.label + ' — ' + g.heure + ' <span>· ' + l.length + ' attendu(s), ' + p + ' présent(s)</span></div>';
      if (!l.length) { h += '<div style="color:#666;padding:1rem;background:#1a1a1a;border-radius:10px;font-size:14px;">Personne ce samedi</div>'; return; }
      l.forEach(function(x) {
        var n = x.niveau || '';
        var tag = x.carnet ? '<span class="tag" style="background:#1a1a0a;border:1px solid #FFEE00;color:#FFEE00;">🎟️ carnet · ' + x.seances_restantes + '</span>'
          : (n.indexOf('seance_essai') !== -1 ? '<span class="tag" style="background:#001018;border:1px solid #00d8ff;color:#00d8ff;">🧪 essai</span>' : '');
        var cls = x.present === true ? ' ok' : (x.present === false ? ' no' : '');
        h += '<div class="appel-row' + cls + '">';
        h += '<div class="who"><div class="nom">' + esc(x.enfant) + ' ' + tag + '</div>';
        h += '<div class="meta">' + esc(x.parent) + (x.telephone ? ' · <a href="tel:' + esc(x.telephone) + '" style="color:#FFEE00;">' + esc(x.telephone) + '</a>' : '') + '</div></div>';
        h += '<button class="btn-p oui' + (x.present===true?' on':'') + '" onclick="pointer(' + x.id + ',true)">✓</button>';
        h += '<button class="btn-p non' + (x.present===false?' on':'') + '" onclick="pointer(' + x.id + ',false)">✗</button>';
        h += '</div>';
      });
    });
    document.getElementById('liste').innerHTML = h;
  }

  if (PWD) {
    remplirDates();
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    charger();
  }
</script>
</body>
</html>
