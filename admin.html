<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Hyrox Challenge La Buse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; }
    .login { max-width: 400px; margin: 5rem auto; padding: 2rem; background: #111; border-radius: 14px; border: 1px solid #222; text-align: center; }
    .login h1 { color: #FFEE00; font-size: 20px; margin-bottom: 1.5rem; }
    .login input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; font-size: 14px; margin-bottom: 12px; font-family: sans-serif; }
    .login button { width: 100%; padding: 12px; background: #FFEE00; color: #0a0a0a; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: sans-serif; }
    .header { background: #111; border-bottom: 3px solid #FFEE00; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { color: #FFEE00; font-size: 18px; }
    .header button { background: transparent; border: 1px solid #333; color: #888; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: sans-serif; }
    .content { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: #111; border: 1px solid #222; border-radius: 12px; padding: 1rem; text-align: center; }
    .stat-val { font-size: 24px; font-weight: 800; color: #FFEE00; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid #222; }
    .tab { padding: 12px 20px; background: transparent; border: none; color: #666; font-size: 14px; font-weight: 700; cursor: pointer; font-family: sans-serif; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #FFEE00; border-bottom-color: #FFEE00; }
    .tab:hover:not(.active) { color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #333; background: #111; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; font-family: sans-serif; }
    .filter-btn.active { background: #FFEE00; color: #0a0a0a; border-color: #FFEE00; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #FFEE00; color: #0a0a0a; padding: 10px 12px; text-align: left; font-weight: 800; white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid #1a1a1a; color: #ccc; }
    tr:hover td { background: #111; }
    .badge-paye { background: #0a1a0a; color: #4CAF50; border: 1px solid #4CAF50; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .badge-attente { background: #1a1400; color: #FFEE00; border: 1px solid #FFEE00; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .section-title { font-size: 16px; font-weight: 800; color: #FFEE00; margin: 1.5rem 0 1rem; }
    .tshirt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .tshirt-card { background: #111; border: 1px solid #222; border-radius: 10px; padding: 12px; text-align: center; }
    .tshirt-val { font-size: 22px; font-weight: 800; color: #FFEE00; }
    .tshirt-label { font-size: 12px; color: #888; margin-top: 4px; }
    .export-btn { background: #FFEE00; color: #0a0a0a; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 800; cursor: pointer; font-family: sans-serif; }
    .vague-block { background: #111; border: 1px solid #222; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .vague-header { background: #1a1400; border-bottom: 1px solid #FFEE00; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .vague-title { font-size: 14px; font-weight: 800; color: #FFEE00; }
    .vague-info { font-size: 12px; color: #888; }
    .vague-row { display: flex; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #1a1a1a; font-size: 13px; align-items: center; }
    .vague-row:last-child { border-bottom: none; }
    .vague-num { width: 24px; height: 24px; border-radius: 50%; background: #FFEE00; color: #0a0a0a; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; flex-shrink: 0; }
    .vague-name { flex: 1; color: #fff; font-weight: 600; }
    .vague-temps { color: #FFEE00; font-family: monospace; font-size: 12px; }
    .cat-block { margin-bottom: 1.5rem; }
    .cat-header { background: #1a1400; border: 1px solid #FFEE00; border-radius: 10px 10px 0 0; padding: 10px 14px; font-size: 14px; font-weight: 800; color: #FFEE00; }
    .cat-body { background: #111; border: 1px solid #222; border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
  </style>
</head>
<body>

<div id="login-page">
  <div class="login">
    <h1>🔒 Admin — Hyrox Challenge La Buse</h1>
    <input type="password" id="pwd" placeholder="Mot de passe" onkeypress="if(event.key==='Enter') login()">
    <button type="button" onclick="login()">Accéder</button>
    <div id="login-error" style="color:#C0392B;font-size:13px;margin-top:10px;"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <div class="header">
    <h1>🏆 Hyrox Challenge La Buse — Admin</h1>
    <button type="button" onclick="logout()">Déconnexion</button>
  </div>

  <div class="content">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="total-inscrits">—</div><div class="stat-label">Total inscrits</div></div>
      <div class="stat"><div class="stat-val" id="total-solo">—</div><div class="stat-label">Solo</div></div>
      <div class="stat"><div class="stat-val" id="total-duo">—</div><div class="stat-label">Duo</div></div>
      <div class="stat"><div class="stat-val" id="total-relais">—</div><div class="stat-label">Relais</div></div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" onclick="showTab('chronologique')">🕐 Chronologique</button>
      <button type="button" class="tab" onclick="showTab('categories')">📊 Par catégories</button>
      <button type="button" class="tab" onclick="showTab('vagues')">⏱ Vagues</button>
      <button type="button" class="tab" onclick="showTab('tshirts')">👕 T-shirts</button>
    </div>

    <!-- ONGLET CHRONOLOGIQUE -->
    <div class="tab-content active" id="tab-chronologique">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <div class="filters" id="cat-filters">
          <button type="button" class="filter-btn active" onclick="filterData('all',this)">Tous</button>
          <button type="button" class="filter-btn" onclick="filterData('solo',this)">Solo</button>
          <button type="button" class="filter-btn" onclick="filterData('duo',this)">Duo</button>
          <button type="button" class="filter-btn" onclick="filterData('relais',this)">Relais</button>
        </div>
        <button type="button" class="export-btn" onclick="exportCSV()">⬇️ Exporter CSV</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Nom</th><th>Prénom</th><th>Email</th><th>Catégorie</th>
              <th>Équipe</th><th>T-shirt</th><th>Temps estimé</th><th>Prix</th><th>Statut</th><th>Date</th>
            </tr>
          </thead>
          <tbody id="inscrits-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ONGLET PAR CATEGORIES -->
    <div class="tab-content" id="tab-categories">
      <div id="categories-content"></div>
    </div>

    <!-- ONGLET VAGUES -->
    <div class="tab-content" id="tab-vagues">
      <div style="margin-bottom:1rem;font-size:13px;color:#888;">Vagues de 4 — classées par temps estimé du plus rapide au plus lent</div>
      <div id="vagues-content"></div>
    </div>

    <!-- ONGLET TSHIRTS -->
    <div class="tab-content" id="tab-tshirts">
      <div class="tshirt-grid" id="tshirt-grid"></div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = 'https://mzyfnmjzlosranptwucr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SjaqadxtlQdtASZ6TqE61g_2MyPRKEC';
  const MOT_DE_PASSE = 'stephaniefitness974';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var allData = [];
  var currentFilter = 'all';

  var CAT_ORDER = [
    'duo scaled femmes', 'solo scaled femmes', 'solo rx femmes', 'duo rx femme',
    'duo rx homme', 'duo scaled hommes', 'duo scaled mixte', 'duo rx mixte',
    'solo scaled hommes', 'solo rx hommes', 'relais'
  ];

  var TEMPS_ORDER = {
    'moins-1h': 1, 'Entre 1h et 1h10': 2, '1h-1h10': 2,
    'Entre 1h10 et 1h20': 3, '1h10-1h20': 3,
    'Entre 1h20 et 1h30': 4, '1h20-1h30': 4,
    'Entre 1h30 et 1h40': 5, '1h30-1h40': 5,
    '1h40 et plus': 6, '1h40+': 6
  };

  function getCatKey(categorie) {
    if (!categorie) return '';
    var c = categorie.toLowerCase();
    if (c.includes('relais')) return 'relais';
    if (c.includes('duo') && c.includes('scaled') && c.includes('femme')) return 'duo scaled femmes';
    if (c.includes('duo') && c.includes('scaled') && c.includes('homme') && !c.includes('mixte')) return 'duo scaled hommes';
    if (c.includes('duo') && c.includes('scaled') && c.includes('mixte')) return 'duo scaled mixte';
    if (c.includes('duo') && c.includes('rx') && c.includes('femme') && !c.includes('mixte')) return 'duo rx femme';
    if (c.includes('duo') && c.includes('rx') && c.includes('homme') && !c.includes('mixte')) return 'duo rx homme';
    if (c.includes('duo') && c.includes('rx') && c.includes('mixte')) return 'duo rx mixte';
    if (c.includes('solo') && c.includes('scaled') && c.includes('femme')) return 'solo scaled femmes';
    if (c.includes('solo') && c.includes('scaled') && c.includes('homme')) return 'solo scaled hommes';
    if (c.includes('solo') && c.includes('rx') && c.includes('femme')) return 'solo rx femmes';
    if (c.includes('solo') && c.includes('rx') && c.includes('homme')) return 'solo rx hommes';
    return c;
  }

  function getCatLabel(key) {
    var labels = {
      'duo scaled femmes': 'Duo Scaled Femmes', 'solo scaled femmes': 'Solo Scaled Femmes',
      'solo rx femmes': 'Solo RX Femmes', 'duo rx femme': 'Duo RX Femmes',
      'duo rx homme': 'Duo RX Hommes', 'duo scaled hommes': 'Duo Scaled Hommes',
      'duo scaled mixte': 'Duo Scaled Mixte', 'duo rx mixte': 'Duo RX Mixte',
      'solo scaled hommes': 'Solo Scaled Hommes', 'solo rx hommes': 'Solo RX Hommes',
      'relais': 'Relais'
    };
    return labels[key] || key;
  }

  function getTempsOrder(temps) {
    if (!temps) return 99;
    for (var key in TEMPS_ORDER) {
      if (temps.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(temps.toLowerCase())) {
        return TEMPS_ORDER[key];
      }
    }
    return 99;
  }

  function login() {
    var pwd = document.getElementById('pwd').value;
    if (pwd === MOT_DE_PASSE) {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('login-error').textContent = '❌ Mot de passe incorrect';
    }
  }

  function logout() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-page').style.display = 'block';
    document.getElementById('pwd').value = '';
  }

  async function loadData() {
    var { data, error } = await db.from('Inscriptions').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allData = data || [];
    renderStats();
    renderTable();
    renderCategories();
    renderVagues();
    renderTshirts();
  }

  function renderStats() {
    document.getElementById('total-inscrits').textContent = allData.length;
    document.getElementById('total-solo').textContent = allData.filter(function(d){ return d.categorie && d.categorie.toLowerCase().includes('solo'); }).length;
    document.getElementById('total-duo').textContent = allData.filter(function(d){ return d.categorie && d.categorie.toLowerCase().includes('duo'); }).length;
    document.getElementById('total-relais').textContent = allData.filter(function(d){ return d.categorie && d.categorie.toLowerCase().includes('relais'); }).length;
  }

  function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    event.target.classList.add('active');
  }

  function filterData(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('#cat-filters .filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    renderTable();
  }

  function renderTable() {
    var filtered = allData.filter(function(d) {
      if (currentFilter === 'all') return true;
      return d.categorie && d.categorie.toLowerCase().includes(currentFilter);
    });
    var html = '';
    filtered.forEach(function(d, i) {
      var date = d.created_at ? new Date(d.created_at).toLocaleDateString('fr-FR') : '—';
      var statut = d.statut_paiement === 'paye' ? '<span class="badge-paye">✓ Payé</span>' : '<span class="badge-attente">En attente</span>';
      html += '<tr>';
      html += '<td style="color:#666;">' + (i+1) + '</td>';
      html += '<td><strong style="color:#fff;">' + (d.nom||'—') + '</strong></td>';
      html += '<td>' + (d.prenom||'—') + '</td>';
      html += '<td style="font-size:12px;">' + (d.email||'—') + '</td>';
      html += '<td>' + (d.categorie||'—') + '</td>';
      html += '<td>' + (d.nom_equipe||'—') + '</td>';
      html += '<td>' + (d.tshirt_taille||'—') + ' ' + (d.tshirt_coupe||'') + '</td>';
      html += '<td>' + (d.temps_estime||'—') + '</td>';
      html += '<td style="color:#FFEE00;font-weight:700;">' + (d.prix||'—') + ' €</td>';
      html += '<td>' + statut + '</td>';
      html += '<td style="font-size:12px;">' + date + '</td>';
      html += '</tr>';
    });
    document.getElementById('inscrits-body').innerHTML = html || '<tr><td colspan="11" style="text-align:center;color:#666;padding:2rem;">Aucun inscrit</td></tr>';
  }

  function renderCategories() {
    var groups = {};
    allData.forEach(function(d) {
      var key = getCatKey(d.categorie);
      if (!groups[key]) groups[key] = [];
      groups[key].push(d);
    });

    CAT_ORDER.forEach(function(key) {
      if (groups[key]) {
        groups[key].sort(function(a, b) {
          return getTempsOrder(a.temps_estime) - getTempsOrder(b.temps_estime);
        });
      }
    });

    var html = '';
    CAT_ORDER.forEach(function(key) {
      if (!groups[key] || groups[key].length === 0) return;
      html += '<div class="cat-block">';
      html += '<div class="cat-header">' + getCatLabel(key) + ' <span style="color:#888;font-size:12px;font-weight:400;">(' + groups[key].length + ' inscrits)</span></div>';
      html += '<div class="cat-body"><table><thead><tr><th>#</th><th>Nom</th><th>Prénom</th><th>Équipe</th><th>Temps estimé</th><th>T-shirt</th><th>Statut</th></tr></thead><tbody>';
      groups[key].forEach(function(d, i) {
        var statut = d.statut_paiement === 'paye' ? '<span class="badge-paye">✓ Payé</span>' : '<span class="badge-attente">En attente</span>';
        html += '<tr>';
        html += '<td style="color:#FFEE00;font-weight:700;">' + (i+1) + '</td>';
        html += '<td><strong style="color:#fff;">' + (d.nom||'—') + '</strong></td>';
        html += '<td>' + (d.prenom||'—') + '</td>';
        html += '<td>' + (d.nom_equipe||'—') + '</td>';
        html += '<td>' + (d.temps_estime||'—') + '</td>';
        html += '<td>' + (d.tshirt_taille||'—') + ' ' + (d.tshirt_coupe||'') + '</td>';
        html += '<td>' + statut + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
    });

    document.getElementById('categories-content').innerHTML = html || '<div style="color:#666;padding:2rem;text-align:center;">Aucun inscrit</div>';
  }

  function renderVagues() {
    var groups = {};
    allData.forEach(function(d) {
      var key = getCatKey(d.categorie);
      if (!groups[key]) groups[key] = [];
      groups[key].push(d);
    });

    CAT_ORDER.forEach(function(key) {
      if (groups[key]) {
        groups[key].sort(function(a, b) {
          return getTempsOrder(a.temps_estime) - getTempsOrder(b.temps_estime);
        });
      }
    });

    var html = '';
    var vagueNum = 1;

    CAT_ORDER.forEach(function(key) {
      if (!groups[key] || groups[key].length === 0) return;
      var inscrits = groups[key];
      for (var i = 0; i < inscrits.length; i += 4) {
        var groupe = inscrits.slice(i, i + 4);
        html += '<div class="vague-block">';
        html += '<div class="vague-header">';
        html += '<div class="vague-title">Vague ' + vagueNum + ' — ' + getCatLabel(key) + '</div>';
        html += '<div class="vague-info">' + groupe.length + ' athlète(s)</div>';
        html += '</div>';
        groupe.forEach(function(d, j) {
          html += '<div class="vague-row">';
          html += '<div class="vague-num">' + (j+1) + '</div>';
          html += '<div class="vague-name">' + (d.nom||'—') + ' ' + (d.prenom||'') + (d.nom_equipe ? ' — ' + d.nom_equipe : '') + '</div>';
          html += '<div class="vague-temps">' + (d.temps_estime||'—') + '</div>';
          html += '</div>';
        });
        html += '</div>';
        vagueNum++;
      }
    });

    document.getElementById('vagues-content').innerHTML = html || '<div style="color:#666;padding:2rem;text-align:center;">Aucun inscrit</div>';
  }

  function renderTshirts() {
    var counts = {};
    allData.forEach(function(d) {
      if (d.tshirt_taille && d.tshirt_coupe) {
        var key = d.tshirt_taille + ' ' + d.tshirt_coupe;
        counts[key] = (counts[key] || 0) + 1;
      }
    });
    var html = '';
    Object.keys(counts).sort().forEach(function(k) {
      html += '<div class="tshirt-card"><div class="tshirt-val">' + counts[k] + '</div><div class="tshirt-label">' + k + '</div></div>';
    });
    document.getElementById('tshirt-grid').innerHTML = html || '<div style="color:#666;font-size:13px;">Aucune donnée</div>';
  }

  function exportCSV() {
    var headers = ['Nom','Prénom','Email','Catégorie','Équipe','T-shirt','Temps estimé','Prix','Statut','Date'];
    var rows = allData.map(function(d) {
      return [
        d.nom||'', d.prenom||'', d.email||'', d.categorie||'',
        d.nom_equipe||'', (d.tshirt_taille||'') + ' ' + (d.tshirt_coupe||''),
        d.temps_estime||'', d.prix||'', d.statut_paiement||'',
        d.created_at ? new Date(d.created_at).toLocaleDateString('fr-FR') : ''
      ].join(';');
    });
    var csv = [headers.join(';'), ...rows].join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'inscrits_hyrox.csv';
    a.click();
  }

  document.addEventListener('DOMContentLoaded', function() {});
</script>
</body>
</html>
